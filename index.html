<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="View Point Public School - Nurturing Excellence in Education. A premier educational institution dedicated to academic excellence, character development, and holistic student growth." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="View Point Public School - Nurturing Excellence" />
  <meta property="og:description" content="A premier educational institution dedicated to academic excellence, character development, and holistic student growth." />
  <meta property="og:site_name" content="View Point Public School" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="View Point Public School - Nurturing Excellence" />
  <meta name="twitter:description" content="A premier educational institution dedicated to academic excellence, character development, and holistic student growth." />
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#12335B" />
  <meta name="msapplication-navbutton-color" content="#12335B" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <title>View Point Public School - Nurturing Excellence in Education</title>
  
  <style>
    /* Critical CSS for initial load */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #F8FAFC;
      color: #172033;
      min-height: 100vh;
    }
    
    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Loading state */
    .initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    
    .initial-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loader-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .loader-text {
      font-family: 'Manrope', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: #12335B;
      margin-bottom: 0.5rem;
    }
    
    .loader-subtext {
      font-size: 0.875rem;
      color: #64748B;
    }
    
    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E5E7EB;
      border-top-color: #245A8D;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 1.5rem;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Skip to content link for accessibility */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #12335B;
      color: white;
      padding: 8px 16px;
      z-index: 10000;
      transition: top 0.3s;
      text-decoration: none;
      font-weight: 500;
    }
    
    .skip-link:focus {
      top: 0;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  
  <div id="root">
    <!-- Initial loading state -->
    <div class="initial-loader" id="initial-loader">
      <svg class="loader-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" stroke="#12335B" stroke-width="4" fill="none"/>
        <path d="M50 15 L50 50 L75 65" stroke="#245A8D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="50" cy="50" r="8" fill="#D99500"/>
        <path d="M25 75 L50 60 L75 75" stroke="#12335B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="loader-text">View Point Public School</div>
      <div class="loader-subtext">Loading...</div>
      <div class="loader-spinner"></div>
    </div>
  </div>
  
  <script>
    // Hide loader when app is ready
    window.addEventListener('load', function() {
      setTimeout(function() {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(function() {
            loader.remove();
          }, 300);
        }
      }, 100);
    });
  </script>
  
  <!-- 
    View Point Public School
    A comprehensive school management system built with React, TypeScript, and Supabase
  -->
</body>
</html>
