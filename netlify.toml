# Netlify deployment configuration
# Static Vite build. No server functions required.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app fallback so deep links resolve to the React shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline hardening. Content-Security-Policy is intentionally omitted so the
# Supabase and Google AI Studio endpoints can be reached without extra setup.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
